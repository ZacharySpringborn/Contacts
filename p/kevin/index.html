<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Contact Update — Zachary Springborn</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zachary Springborn">
<meta property="og:title" content="Hi Kevin! — from Zachary Springborn">
<meta property="og:description" content="I have something to send you — could you confirm your mailing address? Takes about 30 seconds.">
<meta property="og:url" content="https://zacharyspringborn.github.io/Contacts/p/kevin/">
<meta property="og:image" content="https://zacharyspringborn.github.io/Contacts/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#14110f">

<style>
  :root {
    --bg: #14110f; --card: #1f1a17; --line: #3a312b; --text: #f3ece4;
    --muted: #b5a99c; --accent: #FF3800; --accent-2: #FF5C2E;  /* Hermès orange (brand) */ --ok: #7fbf7f; --err: #e07a6a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 48px; }
  .badge { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #1a120b; display: grid; place-items: center; font-weight: 700; letter-spacing: .5px; }
  h1 { font-size: 1.55rem; margin: 10px 0 6px; letter-spacing: .2px; }
  p.lead { color: var(--muted); margin: 0 0 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  label { display: block; font-size: .86rem; color: var(--muted); margin: 14px 0 6px; }
  label .opt { color: #8a7e72; font-weight: normal; }
  input, select, textarea { width: 100%; padding: 12px 12px; font-size: 16px; font-family: inherit; color: var(--text);
         background: #120f0d; border: 1px solid var(--line); border-radius: 10px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 2fr 1fr 1.2fr; gap: 12px; }
  @media (max-width: 460px) { .row, .row3 { grid-template-columns: 1fr; } }
  button { margin-top: 20px; width: 100%; padding: 14px; font-size: 1.05rem; font-weight: 600;
           color: #1a120b; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; }
  button:hover { background: var(--accent-2); }
  button[disabled] { opacity: .6; cursor: wait; }
  .msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; display: none; }
  .msg.ok { display: block; background: rgba(127,191,127,.12); border: 1px solid var(--ok); }
  .msg.err { display: block; background: rgba(224,122,106,.12); border: 1px solid var(--err); }
  .fine { color: #8a7e72; font-size: .8rem; margin-top: 18px; text-align: center; }
  .hp { position: absolute; left: -9999px; }
  .setup { background: #3b1d14; border: 1px solid var(--err); padding: 10px 12px; border-radius: 10px;
           margin-bottom: 16px; font-size: .9rem; display: none; }
  /* Print on white paper */
  @media print {
    :root { --bg: #fff; --card: #fff; --line: #999; --text: #000; --muted: #333; }
    body { background: #fff; color: #000; }
    input, select, textarea { background: #fff; color: #000; border: 1px solid #999; }
    button, .msg, .setup { display: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="badge" aria-hidden="true">ZS</div>
  <h1 id="greet">Hi there!</h1>
  <p class="lead">I have something to send you and want to make sure I have your current address.
    Would you mind filling this in? Thank you!<br>— Zachary Springborn</p>

  <div class="setup" id="setup">Setup needed: add the Formspree form ID in the script settings.</div>

  <form class="card" id="f" action="https://formspree.io/f/xoeegarw" method="POST" novalidate>
    <input type="hidden" name="ref" id="ref">
    <input type="hidden" name="_subject" id="subj" value="Contact update">
    <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off">

    <label for="name">Your name(s) — as you'd like them listed</label>
    <input id="name" name="name" required autocomplete="name" placeholder="e.g., Jane &amp; John Smith">

    <label for="street">Street address</label>
    <input id="street" name="street" required autocomplete="address-line1">

    <label for="street2">Apt / Suite / Unit <span class="opt">(optional)</span></label>
    <input id="street2" name="street2" autocomplete="address-line2">

    <div class="row3">
      <div><label for="city">City</label><input id="city" name="city" required autocomplete="address-level2"></div>
      <div><label for="state">State / Prov.</label><input id="state" name="state" required autocomplete="address-level1"></div>
      <div><label for="zip">ZIP / Postal</label><input id="zip" name="zip" required autocomplete="postal-code"></div>
    </div>

    <label for="country">Country</label>
    <input id="country" name="country" value="United States" autocomplete="country-name">

    <div class="row">
      <div><label for="phone">Phone <span class="opt">(optional)</span></label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
      <div><label for="email">Email <span class="opt">(optional)</span></label><input id="email" name="email" type="email" autocomplete="email"></div>
    </div>

    <label for="note">Anything else? <span class="opt">(optional)</span></label>
    <textarea id="note" name="note" placeholder="Moved recently? New number? Anything I should know?"></textarea>

    <button type="submit" id="go">Send my info</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>

  <p class="fine">Your info goes only to Zachary and is never shared.</p>
</div>

<script>
  // ======== SETTINGS ========
  const FORMSPREE_ID = "xoeegarw";   // Formspree: "November 9, 2026 Contact Update" (Contacts project)
  // ==========================

  const q = new URLSearchParams(location.search);
  const n = (q.get("n") || "Kevin").slice(0, 60);
  const id = (q.get("id") || "TG-017").replace(/[^A-Za-z0-9-]/g, "").slice(0, 20);
  if (n) document.getElementById("greet").textContent = "Hi " + n + "!";
  document.getElementById("ref").value = id;
  document.getElementById("subj").value = "Contact update" + (id ? " — " + id : "") + (n ? " — " + n : "");

  const configured = FORMSPREE_ID && FORMSPREE_ID !== "YOUR_FORM_ID";
  if (!configured) document.getElementById("setup").style.display = "block";

  const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
  function show(kind, text) { msg.className = "msg " + kind; msg.textContent = text; }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const missing = [...f.querySelectorAll("[required]")].filter(el => !el.value.trim());
    if (missing.length) { show("err", "Please fill in your name and full address."); missing[0].focus(); return; }
    if (!configured) { show("err", "This form isn't connected yet — please text Zachary your info instead."); return; }
    go.disabled = true; go.textContent = "Sending…";
    try {
      const res = await fetch("https://formspree.io/f/" + FORMSPREE_ID, {
        method: "POST", body: new FormData(f), headers: { "Accept": "application/json" }
      });
      if (res.ok) {
        f.querySelectorAll("input:not([type=hidden]), textarea, button").forEach(el => el.disabled = true);
        go.textContent = "Sent ✓";
        show("ok", "Got it — thank you! I really appreciate it.");
      } else { throw new Error(); }
    } catch (err) {
      go.disabled = false; go.textContent = "Send my info";
      show("err", "Something went wrong sending that. Please try again, or just text Zachary your info.");
    }
  });
</script>
</body>
</html>
